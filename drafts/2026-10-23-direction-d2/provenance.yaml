  - home agents/cooper/memory.md and reference-library.md (1.5, 1.6, the Choreotope entry, section 3 rejections)
  - Ballerini et al. (2008), "Interaction ruling animal collective behavior depends on topological rather than metric distance", PNAS 105(4) - starlings track about 6 to 7 neighbours by rank. Limit - a field study of real starlings; our flock is a graphics model that borrows the rule, not evidence about birds or organisations.
  - Reynolds (1987), Boids - separation, alignment, cohesion. Same limit.
  - Marey's chronophotographs (direction D's long exposure) - the trails that lengthen as you scroll.

rejected:
  - "csm_murmurations_v5.html as the flock: it is a curl-noise dot field, not a flock; the corpus records Rosie rejecting it twice; her 'v5' in speech is file v3."
  - "Copying v3's code: it is a 2D canvas with fake depth and audio stems; rebuilt in true 3D instead, keeping its look and numbers."
  - "Google Fonts and CDN script tags: they send visitors' IP addresses to third parties; everything is self-hosted."
  - "Flat white-on-black: replaced by a shader sky (gradient, horizon glow, two parallax cloud layers, grain, vignette)."
  - "A coloured CSS glow on the axis dot (impeccable detect, dark-glow): removed; the falcon's light lives in the shader."
  - "Random birds for the word formation, and filled letter shapes: the word never resolved; now the nearest birds trace lighter letters."
  - "Flock over body text: the shader dims the flock's light behind each block of text instead."
  - "A third font for body text (D used Instrument Sans): Bricolage Grotesque at a small optical size does both jobs; two families, not three."

