# Secret scan: calls the org's one shared workflow (source: org-dotgithub/.github/workflows/secret-scan.yml
# in MangroveFutures/home; it runs gitleaks 8.30.1, pinned and checksum verified, and never prints a secret).
# A pull request scans its new commits; the Monday cron and the button scan the full history.
# No push-to-main trigger, on purpose: it spent Actions minutes on every merge (Rosie, 23 Oct 2026).
# Changing this file is red tier (ORG-0005).
name: Secret scan

on:
  pull_request:
  schedule:
    - cron: "53 5 * * 1" # Mondays 53 past 05:00 UTC (a different minute per repo); full history
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    uses: MangroveFutures/.github/.github/workflows/secret-scan.yml@main
