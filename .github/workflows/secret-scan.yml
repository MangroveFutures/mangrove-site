# Secret scan: looks for passwords, keys and tokens in the code and in the whole git history.
# Tool: gitleaks (MIT licence), the released binary, pinned to an exact version and checked against a
# SHA-256 written below. We do NOT use the gitleaks GitHub Action: it needs a licence key for
# organisation accounts. Decision record: handbook/reference/intake-secret-scanner-2026-10-23.md in home
# (ORG-0008). The same scan runs by hand anywhere with home's scripts/secret_scan.sh.
#
# - Pull request, push to main: scans only the new commits (fast).
# - Monday cron and the manual button: scans the FULL history of every branch.
# - --redact=100 and a report file: no secret value ever reaches a log. The summary below prints only
#   the rule name, the file, the line and the short commit.
# - Changing this file is red tier (ORG-0005): it needs Rosie's explicit yes to merge.
name: Secret scan

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "53 5 * * 1" # Mondays 05:41 UTC, on the default branch; full history
  workflow_dispatch: # the button: full history

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  GITLEAKS_VERSION: "8.30.1"
  # SHA-256 of gitleaks_8.30.1_linux_x64.tar.gz, from the release's checksums file, 23 Oct 2026.
  GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Full history, so the weekly scan sees everything and a diff scan can reach its base commit.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install gitleaks (pinned, checksum verified)
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/gl.tgz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/gl.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gl.tgz" -C "$RUNNER_TEMP" gitleaks

      - name: Scan
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          set -uo pipefail
          range=""
          if [ "$EVENT" = "pull_request" ]; then range="${PR_BASE}..HEAD"; fi
          if [ "$EVENT" = "push" ] && ! [[ "$PUSH_BEFORE" =~ ^0*$ ]]; then range="${PUSH_BEFORE}..HEAD"; fi
          args=(git . --config .gitleaks.toml --redact=100 --no-banner --log-level error --exit-code 2
                --report-format json --report-path "$RUNNER_TEMP/report.json")
          if [ -n "$range" ]; then args+=(--log-opts "$range"); echo "scope: commits $range"; else echo "scope: full history"; fi
          # Exit codes: 0 clean, 2 leaks found, anything else (or no report) means the scan itself broke,
          # which must fail the job and never count as clean.
          "$RUNNER_TEMP/gitleaks" "${args[@]}" >/dev/null 2>"$RUNNER_TEMP/gl-stderr.txt"; rc=$?
          # --log-level error means anything on stderr is an error (a bad commit range exits 0 but writes one).
          if { [ "$rc" -ne 0 ] && [ "$rc" -ne 2 ]; } || [ -s "$RUNNER_TEMP/gl-stderr.txt" ] || [ ! -s "$RUNNER_TEMP/report.json" ]; then
            echo "::error::the secret scan itself failed (gitleaks exit $rc); this is NOT a clean result"
            head -c 600 "$RUNNER_TEMP/gl-stderr.txt"; exit 1
          fi
          python3 -I - "$RUNNER_TEMP/report.json" <<'PY'
          import json, os, sys
          rows = json.load(open(sys.argv[1])) or []
          if not rows:
              print("secret scan: clean")
              sys.exit(0)
          lines = ["## Secret scan: %d finding(s)" % len(rows), "",
                   "No secret value is shown. The way out, in this order:", "",
                   "1. **Rotate the credential at its provider first.** A secret that reached git is public until rotated.",
                   "2. Then remove it from the files, and say in the PR that it was rotated. Rewriting history is a",
                   "   separate decision (deleting history needs Rosie's yes); rotation is what makes the leak harmless.",
                   "3. Only for a **proven false positive**, add a narrow entry to `.gitleaks.toml`: one rule, one file,",
                   "   with a comment saying why it is not a secret.",
                   "4. Register a real credential in `handbook/reference/credentials.yaml` in the home repo (metadata only, no value).",
                   "", "| Rule | File:line | Commit |", "|---|---|---|"]
          for r in rows:
              lines.append("| %s | %s:%s | %s |" % (r["RuleID"], r["File"], r["StartLine"], r["Commit"][:8]))
          text = "\n".join(lines)
          print(text)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as f:
              f.write(text + "\n")
          sys.exit(1)
          PY
