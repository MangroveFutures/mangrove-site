<!doctype html>
<html lang="en-GB" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="design-record" content="next/DESIGN-NOTES.md">
<title>Mangrove sky (the flock, for the preview's hero)</title>
<!-- A host for the live site's flock.js, loaded unchanged from ../flock.js. The preview page frames this file in its
     hero. flock.js looks for the elements below by id and class, so they exist here, hidden; nothing in flock.js or
     vendor/ is edited. The parent page syncs data-theme and data-lib-motion onto this <html>, and sets motion to
     "reduce" when the hero scrolls out of view so the flock rests (flock.js already watches both attributes). -->
<link rel="preload" href="../fonts/bricolage-grotesque-var.woff2" as="font" type="font/woff2" crossorigin>
<style>
@font-face{font-family:"Bricolage Grotesque";src:url("../fonts/bricolage-grotesque-var.woff2") format("woff2");font-weight:200 800;font-display:swap;}
@font-face{font-family:"Newsreader";src:url("../fonts/newsreader-var.woff2") format("woff2");font-weight:200 800;font-display:swap;}
/* The live site's two palettes, copied from ../index.html so the shader reads the same colours. */
:root,[data-theme="dark"]{--sky-top:#0c1117;--sky-mid:#141b23;--sky-low:#2b2420;--glow:#d0703f;--ink:#ece6da;--ink-soft:#b3ada3;--falcon:#ff6a47;--heat:#ffb07a;}
[data-theme="light"]{--sky-top:#e7e9e4;--sky-mid:#d7dbd4;--sky-low:#c3c6bb;--glow:#e09468;--ink:#15191c;--ink-soft:#40474b;--falcon:#b8341a;--heat:#c4521f;}
html,body{margin:0;height:100%;overflow:hidden;background:var(--sky-mid);}
body{background:linear-gradient(180deg,var(--sky-top),var(--sky-mid) 48%,var(--sky-low));}
#sky{position:fixed;inset:0;width:100%;height:100%;display:block;}
/* Same box as the home page's .tagline, so the shader dims the flock's light behind the words it cannot see. */
.wrap{position:absolute;left:0;right:0;top:clamp(1.4rem,5vh,3rem);width:min(100% - 2.5rem,84rem);margin-inline:auto;}
@media (min-width:48rem){.wrap{width:min(100% - 5rem,84rem);}}
.tagline{font-family:"Newsreader",Georgia,serif;font-weight:300;font-size:clamp(1.7rem,3.6vw,3.1rem);line-height:1.08;
  letter-spacing:-.02em;margin:0;max-width:26ch;text-wrap:balance;visibility:hidden;}
.hooks,.hooks *{position:absolute;width:0;height:0;overflow:hidden;}
#atmos,#tilt{display:none!important;}
</style>
</head>
<body>
<canvas id="sky" aria-hidden="true"></canvas>
<div class="wrap"><p class="tagline">Mangrove builds tools that fit the person, and uses each one to study how people and AI work together.</p></div>
<div class="hooks" aria-hidden="true">
  <p class="hint"></p>
  <nav class="axis"><ol><li><a href="#research" tabindex="-1">.</a></li></ol><span class="dot"></span></nav>
  <div id="research"></div><div id="studio"></div><div id="services"></div><div id="write"><a class="email" tabindex="-1"></a></div>
  <button id="atmos" type="button" tabindex="-1"></button><button id="tilt" type="button" tabindex="-1" hidden></button>
</div>
<script type="module" src="../flock.js"></script>
</body>
</html>
