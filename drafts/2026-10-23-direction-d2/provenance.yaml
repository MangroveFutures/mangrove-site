brief: |
  Rosie, 23 Oct 2026, relayed by the coordinating session: "Go with option D, I think, for the design.
  Although I like the one with the wonky lettering. I like the simplicity of the tagline on the front
  page, but then the text that is in option B under each heading is nice and clear and simple. So keep
  that for now. It would just be nice if we could do something more interesting than just white on
  black: something with some texture and depth and a little softness and 3D coming in and out, forwards
  and backwards, like we had played with scale, so it's not just flat on the page. Something that uses
  some parallax and will feel a little bit sexier, maybe with some light effects. See what we could do
  in three.js if that's what she can work with. Let her make it a little more like a real designer has
  touched it. Find a way to make it have some wow moments."
  Also: "at the moment it's still very clean ... I'd like options that are more textural, more dynamic,
  clean and natural." On the flock: the interim page's 2D Boids is "a messier version"; the one she
  likes is the Choreotope murmurations, a three.js flock with a web to each creature's 7 nearest
  neighbours. The visitor's mouse or finger is a falcon; a finger must still scroll the page.

